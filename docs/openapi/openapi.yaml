    get:
      tags: [Dunning]
      summary: List dunning pauses
      description: Returns dunning pause records. Pass `active_only=true` for currently paused invoices only. Requires `view_reconciliation`.
      operationId: listDunningPauses
      parameters:
        - name: active_only
          in: query
          schema:
            type: boolean
            default: false
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
      responses:
        '200':
          description: Paginated dunning pause list.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DunningPauseListResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      tags: [Dunning]
      summary: Pause dunning for an invoice
      description: >
        Pauses dunning for the specified invoice. Subsequent send attempts return
        422 `dunning-paused` until resumed. Logged in audit trail.
        Requires `send_dunning`.
      operationId: pauseDunning
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [invoice_id, reason]
              properties:
                invoice_id:
                  type: integer
                  format: int64
                reason:
                  type: string
                  maxLength: 512
      responses:
        '201':
          description: Pause created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DunningPause'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationFailed'


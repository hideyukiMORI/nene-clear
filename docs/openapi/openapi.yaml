          description: Inclusive upper bound on occurred_at (YYYY-MM-DD).
          schema: { type: string, format: date }
        - name: sort_by
          in: query
          description: "Sort column: occurred_at | action | entity_type | actor_id."
          schema: { type: string }
        - name: sort_dir
          in: query
          schema: { type: string, enum: [asc, desc] }
      responses:
        '200':
          description: A page of audit events.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuditEventListResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalServerError'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: HS256 JWT for operator/service authentication (BearerTokenMiddleware).

  parameters:
    IdPath:
      name: id
      in: path
      required: true
      schema:
        type: integer
        format: int64
    Limit:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 50
    Offset:
      name: offset
      in: query
      schema:
        type: integer
        minimum: 0
        default: 0

  responses:
    Unauthorized:
      description: Missing or invalid bearer token.
      headers:
        WWW-Authenticate:
          schema:
            type: string
            example: Bearer
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
          examples:
            unauthorized:
              value:
                type: https://nene-clear.dev/problems/unauthorized
                title: Unauthorized
                status: 401
                detail: A valid bearer token is required.
    Forbidden:
      description: Authenticated but lacking the required capability.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
          examples:
            insufficientCapability:
              value:
                type: https://nene-clear.dev/problems/insufficient-capability
                title: Insufficient Capability
                status: 403
                detail: Your role lacks the capability required for this action.
    NotFound:
      description: The requested resource was not found.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
          examples:
            notFound:
              value:
                type: https://nene-clear.dev/problems/bank-transaction-not-found
                title: Not Found
                status: 404
                detail: The requested resource was not found.
    InvalidStateTransition:
      description: The requested state change is not allowed from the current state.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
          examples:
            invalidStateTransition:
              value:
                type: https://nene-clear.dev/problems/invalid-state-transition
                title: Invalid State Transition
                status: 409
                detail: This reconciliation is already reversed.
    ValidationFailed:
      description: The request body, query, or path parameters contain invalid values.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ValidationProblemDetails'
          examples:
            validationFailed:
              value:
                type: https://nene-clear.dev/problems/validation-failed
                title: Validation Failed
                status: 422
                detail: The request contains invalid values.
                errors:
                  - field: value_date
                    message: A valid date is required.
                    code: required
    PayloadTooLarge:
      description: The request body exceeds the configured size limit.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
          examples:
            payloadTooLarge:
              value:
                type: https://nene-clear.dev/problems/payload-too-large
                title: Payload Too Large
                status: 413
                detail: The uploaded file exceeds the configured size limit.
    UpstreamUnavailable:
      description: The NeNe Invoice upstream is unreachable (degraded mode).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
          examples:
            upstreamUnavailable:
              value:
                type: https://nene-clear.dev/problems/upstream-invoice-unavailable
                title: Upstream Invoice Unavailable
                status: 503
                detail: The Invoice API is unreachable; match confirmation is blocked.
    InternalServerError:
      description: The server encountered an unexpected condition.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
          examples:
            internalServerError:
              value:
                type: https://nene-clear.dev/problems/internal-server-error
                title: Internal Server Error
                status: 500
                detail: The server encountered an unexpected condition.

  schemas:
    ProblemDetails:
      type: object
      description: RFC 9457 Problem Details response.
      required: [type, title, status]
      properties:
        type:
          type: string
          format: uri
          example: https://nene-clear.dev/problems/bank-transaction-not-found
        title:
          type: string
          example: Not Found
        status:
          type: integer
          format: int32
          minimum: 400
          maximum: 599
          example: 404
        detail:
          type: string
        instance:
          type: string
      additionalProperties: true
    ValidationProblemDetails:
      allOf:
        - $ref: '#/components/schemas/ProblemDetails'
        - type: object
          required: [errors]
          properties:
            errors:
              type: array
              minItems: 1
              items:
                $ref: '#/components/schemas/ValidationError'
    ValidationError:
      type: object
      required: [field, message, code]
      properties:
        field:
          type: string
          example: value_date
        message:
          type: string
          example: A valid date is required.
        code:
          type: string
          example: required
      additionalProperties: false

    HealthResponse:
      type: object
      required: [status, service]
      properties:
        status:
          type: string
          enum: [ok, degraded]
        service:
          type: string
          example: NeNe Clear
        checks:
          type: object
          additionalProperties:
            type: string
            enum: [ok, error]

    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 1
      additionalProperties: false
    LoginResponse:
      type: object
      required: [token, user]
      properties:
        token:
          type: string
          description: JWT bearer token.
        user:
          $ref: '#/components/schemas/User'
      additionalProperties: false

    UserRole:
      type: string
      enum: [superadmin, admin, member, viewer]
    UserStatus:
      type: string
      enum: [active, invited]
    User:
      type: object
      required: [user_id, organization_id, email, role, status]
      properties:
        user_id:
          type: integer
          format: int64
        organization_id:
          type: integer
          format: int64
          nullable: true
          description: Null for superadmin (cross-tenant).
        email:
          type: string
          format: email
        role:
          $ref: '#/components/schemas/UserRole'
        status:
          $ref: '#/components/schemas/UserStatus'
    UserListResponse:
      type: object
      required: [items, limit, offset, total]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/User'
        limit:
          type: integer
        offset:
          type: integer
        total:
          type: integer
    CreateUserRequest:
      type: object
      required: [email, role]
      properties:
        email:
          type: string
          format: email
        role:
          $ref: '#/components/schemas/UserRole'
        password:
          type: string
          minLength: 8
      additionalProperties: false
    UpdateUserRequest:
      type: object
      properties:
        role:
          $ref: '#/components/schemas/UserRole'
        status:
          $ref: '#/components/schemas/UserStatus'
      additionalProperties: false

    Organization:
      type: object
      required: [organization_id, slug, name]
      properties:
        organization_id:
          type: integer
          format: int64
        slug:
          type: string
        name:
          type: string
    OrganizationListResponse:
      type: object
      required: [items, limit, offset, total]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Organization'
        limit:
          type: integer
        offset:
          type: integer
        total:
          type: integer
    CreateOrganizationRequest:
      type: object
      required: [slug, name]
      properties:
        slug:
          type: string
        name:
          type: string
      additionalProperties: false

    AccountType:
      type: string
      enum: [ordinary, current]
    BankAccount:
      # Read/response model. Every field is emitted unconditionally by
      # ClearSettingsResponse, so all are required. The write side uses the
      # separate BankAccountInput schema (the PUT handler defaults missing keys
      # and assigns bank_account_id server-side).
      type: object
      required: [bank_account_id, bank_name, bank_branch, account_type, account_number, csv_encoding, csv_date_format, csv_date_column, csv_amount_column, csv_counterparty_column, csv_header_rows]
      properties:
        bank_account_id:
          type: integer
          format: int64
        bank_name:
          type: string
        bank_branch:
          type: string
        account_type:
          $ref: '#/components/schemas/AccountType'
        account_number:
          type: string
        csv_encoding:
          type: string
          example: shift_jis
        csv_date_format:
          type: string
          example: Y/m/d
        csv_date_column:
          type: integer
          description: Column index holding 取引日 / 入金日.
        csv_amount_column:
          type: integer
          description: Column index holding the deposit (入金) amount.
        csv_counterparty_column:
          type: integer
          description: Column index holding 摘要 / 振込依頼人 → counterparty_text.
        csv_header_rows:
          type: integer
          description: Number of header rows to skip.
    BankAccountInput:
      # Write model for UpdateClearSettingsRequest.bank_accounts. Only
      # account_type is required; UpdateClearSettingsHandler defaults every other
      # field, and bank_account_id is assigned server-side (not read from the body).
      type: object
      required: [account_type]
      properties:
        bank_name:
          type: string
        bank_branch:
          type: string
        account_type:
          $ref: '#/components/schemas/AccountType'
        account_number:
          type: string
        csv_encoding:
          type: string
          example: shift_jis
        csv_date_format:
          type: string
          example: Y/m/d
        csv_date_column:
          type: integer
        csv_amount_column:
          type: integer
        csv_counterparty_column:
          type: integer
        csv_header_rows:
          type: integer
    ClearSettings:
      type: object
      required: [organization_id, upstream_base_url, upstream_token_ref, dunning_min_interval_days, fiscal_year_end_month, bank_accounts]
      properties:
        organization_id:
          type: integer
          format: int64
        upstream_base_url:
          type: string
          format: uri
        upstream_token_ref:
          type: string
          description: Name of the env var holding the upstream bearer token (never the secret).
          example: NENE_INVOICE_BEARER_TOKEN
        dunning_min_interval_days:
          type: integer
          default: 7
        fiscal_year_end_month:
          type: integer
          nullable: true
          minimum: 1
          maximum: 12
          description: Fiscal year-end month (決算月). Null when unset.
        bank_accounts:
          type: array
          items:
            $ref: '#/components/schemas/BankAccount'
    UpdateClearSettingsRequest:
      type: object
      properties:
        upstream_base_url:
          type: string
          format: uri
        upstream_token_ref:
          type: string
        dunning_min_interval_days:
          type: integer
        fiscal_year_end_month:
          type: integer
          nullable: true
          minimum: 1
          maximum: 12
        bank_accounts:
          type: array
          items:
            $ref: '#/components/schemas/BankAccountInput'
      additionalProperties: false
    UpstreamConnectionTestResponse:
      type: object
      required: [reachable]
      properties:
        reachable:
          type: boolean
        detail:
          type: string

    BankImportBatchStatus:
      type: string
      enum: [imported, reversed]
    BankImportBatch:
      type: object
      required: [bank_import_batch_id, organization_id, bank_account_id, file_hash, source_filename, row_count, status, imported_at, reversed_at, reversal_reason]
      properties:
        bank_import_batch_id:
          type: integer
          format: int64
        organization_id:
          type: integer
          format: int64
        bank_account_id:
          type: integer
          format: int64
        file_hash:
          type: string
          description: SHA-256 hex of the imported file.
        source_filename:
          type: string
        row_count:
          type: integer
        status:
          $ref: '#/components/schemas/BankImportBatchStatus'
        imported_at:
          type: string
          format: date-time
        reversed_at:
          type: string
          format: date-time
          nullable: true
        reversal_reason:
          type: string
          nullable: true
    BankImportBatchListResponse:
      type: object
      required: [items, limit, offset, total]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/BankImportBatch'
        limit:
          type: integer
        offset:
          type: integer
        total:
          type: integer

    BankTransactionStatus:
      type: string
      enum: [unmatched, partially_matched, matched, voided]
    BankTransaction:
      type: object
      required: [bank_transaction_id, organization_id, bank_import_batch_id, bank_account_id, value_date, amount_cents, counterparty_text, status]
      properties:
        bank_transaction_id:
          type: integer
          format: int64
        organization_id:
          type: integer
          format: int64
        bank_import_batch_id:
          type: integer
          format: int64
        bank_account_id:
          type: integer
          format: int64
        value_date:
          type: string
          format: date
          description: Bank value date (入金日 / 取引日).
        amount_cents:
          type: integer
          format: int64
        counterparty_text:
          type: string
        status:
          $ref: '#/components/schemas/BankTransactionStatus'
    BankTransactionListResponse:
      type: object
      required: [items, limit, offset, total]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/BankTransaction'
        limit:
          type: integer
        offset:
          type: integer
        total:
          type: integer

    UpstreamInvoiceStatus:
      type: string
      enum: [issued, partially_paid, paid]
    UpstreamInvoice:
      type: object
      description: >
        Read-only model owned by NeNe Invoice. Only the fields the upstream proxy
        actually returns are modelled here; issued_at and overdue were removed as
        the response builder never emits them (#317).
      required: [invoice_id, invoice_number, client_id, total_cents, outstanding_cents, due_at, status, currency]
      properties:
        invoice_id:
          type: integer
          format: int64
        invoice_number:
          type: string
        client_id:
          type: integer
          format: int64
        due_at:
          type: string
          format: date
          nullable: true
        total_cents:
          type: integer
          format: int64
        outstanding_cents:
          type: integer
          format: int64
        status:
          $ref: '#/components/schemas/UpstreamInvoiceStatus'
        currency:
          type: string
          enum: [JPY]
    UpstreamInvoiceListResponse:
      type: object
      required: [items, total]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/UpstreamInvoice'
        total:
          type: integer

    ProposeMatchRequest:
      type: object
      required: [bank_transaction_id]
      properties:
        bank_transaction_id:
          type: integer
          format: int64
      additionalProperties: false
    MatchSuggestion:
      type: object
      required: [source, invoice_id, invoice_number, manual_receivable_id, reference_number, amount_cents, outstanding_cents, score, reason]
      properties:
        source:
          type: string
          enum: [invoice_upstream, manual]
          description: Candidate receivable type (ADR 0014).
        invoice_id:
          type: integer
          format: int64
          nullable: true
          description: Set for invoice_upstream candidates.
        invoice_number:
          type: string
          nullable: true
        manual_receivable_id:
          type: integer
          format: int64
          nullable: true
          description: Set for manual candidates (ADR 0014).
        reference_number:
          type: string
          nullable: true
          description: Manual receivable document number.
        amount_cents:
          type: integer
          format: int64
        outstanding_cents:
          type: integer
          format: int64
        score:
          type: number
          format: float
          description: Confidence 0..1 (rules-based in Phase 1).
        reason:
          type: string
          description: Why this candidate was suggested (e.g. exact amount, payer/invoice number in counterparty).
    ProposeMatchResponse:
      type: object
      required: [bank_transaction_id, suggestions, upstream_unavailable]
      properties:
        bank_transaction_id:
          type: integer
          format: int64
        upstream_unavailable:
          type: boolean
          description: >
            True when the Invoice upstream could not be reached, so only manual
            candidates are returned (ADR 0014 degraded mode). The UI surfaces this
            instead of failing the whole proposal.
        suggestions:
          type: array
          items:
            $ref: '#/components/schemas/MatchSuggestion'

    Allocation:
      type: object
      required: [amount_cents]
      properties:
        source:
          type: string
          enum: [invoice_upstream, manual]
          default: invoice_upstream
          description: Target receivable type (ADR 0014). Defaults to invoice_upstream.
        invoice_id:
          type: integer
          format: int64
          description: Required when source is invoice_upstream.
        manual_receivable_id:
          type: integer
          format: int64
          description: Required when source is manual.
        amount_cents:
          type: integer
          format: int64
      additionalProperties: false
    ReconciliationAllocation:
      type: object
      required: [reconciliation_allocation_id, source, invoice_id, manual_receivable_id, amount_cents, payment_id, external_reference]
      properties:
        reconciliation_allocation_id:
          type: integer
          format: int64
        source:
          type: string
          enum: [invoice_upstream, manual]
        invoice_id:
          type: integer
          format: int64
          nullable: true
          description: Set for invoice_upstream allocations.
        manual_receivable_id:
          type: integer
          format: int64
          nullable: true
          description: Set for manual allocations (ADR 0014).
        amount_cents:
          type: integer
          format: int64
        payment_id:
          type: integer
          format: int64
          nullable: true
          description: Upstream payment id (invoice_upstream only); null for manual.
        external_reference:
          type: string
          nullable: true
          example: clear:recon:777
    ConfirmMatchRequest:
      type: object
      required: [bank_transaction_id, allocations]
      properties:
        bank_transaction_id:
          type: integer
          format: int64
        allocations:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/Allocation'
        reason_code:
          type: string
          description: Required for fee absorption; recorded in the audit trail.
      additionalProperties: false
    ReconciliationStatus:
      type: string
      enum: [confirmed, reversed]
    Reconciliation:
      type: object
      required: [payment_reconciliation_id, organization_id, bank_transaction_id, status, reason_code, confirmed_by, confirmed_at, reversed_at, reversal_reason, allocations]
      properties:
        payment_reconciliation_id:
          type: integer
          format: int64
        organization_id:
          type: integer
          format: int64
        bank_transaction_id:
          type: integer
          format: int64
        status:
          $ref: '#/components/schemas/ReconciliationStatus'
        reason_code:
          type: string
          nullable: true
        confirmed_by:
          type: integer
          format: int64
        allocations:
          type: array
          items:
            $ref: '#/components/schemas/ReconciliationAllocation'
        confirmed_at:
          type: string
          format: date-time
        reversed_at:
          type: string
          format: date-time
          nullable: true
        reversal_reason:
          type: string
          nullable: true
    ReconciliationListResponse:
      type: object
      required: [items, limit, offset, total]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Reconciliation'
        limit:
          type: integer
        offset:
          type: integer
        total:
          type: integer

    ClientCreditStatus:
      type: string
      # Matches the ClientCreditStatus enum. Application progress is expressed by
      # remaining_cents, not a status value (#264).
      enum: [open, voided]
    ClientCredit:
      type: object
      required: [client_credit_id, organization_id, client_id, amount_cents, remaining_cents, status, source_bank_transaction_id, reconciliation_id, created_at]
      properties:
        client_credit_id:
          type: integer
          format: int64
        organization_id:
          type: integer
          format: int64
        client_id:
          type: integer
          format: int64
          # Null for a manual-receivable credit; the payer is held in client_name
          # (ADR 0014). See #341.
          nullable: true
        amount_cents:
          type: integer
          format: int64
        remaining_cents:
          type: integer
          format: int64
        status:
          $ref: '#/components/schemas/ClientCreditStatus'
        source_bank_transaction_id:
          type: integer
          format: int64
        reconciliation_id:
          type: integer
          format: int64
        created_at:
          type: string
          format: date-time
    ClientCreditListResponse:
      type: object
      required: [items, limit, offset, total]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/ClientCredit'
        limit:
          type: integer
        offset:
          type: integer
        total:
          type: integer
    ManualReceivableStatus:
      type: string
      enum: [open, partially_paid, paid, cancelled]
    ManualReceivable:
      type: object
      required: [manual_receivable_id, organization_id, source, reference_number, client_name,
                 recipient_email, total_cents, outstanding_cents, currency, issued_at, due_at,
                 status, created_at, updated_at]
      properties:
        manual_receivable_id:
          type: integer
          format: int64
        organization_id:
          type: integer
          format: int64
        source:
          type: string
          enum: [manual]
          description: Discriminator vs Invoice-sourced receivables (ADR 0014); always `manual` here.
        reference_number:
          type: string
          maxLength: 64
          description: External document number; not an invoice number Clear issues (X1).
        client_name:
          type: string
          maxLength: 255
        recipient_email:
          type: string
          format: email
          nullable: true
        total_cents:
          type: integer
          format: int64
        outstanding_cents:
          type: integer
          format: int64
          description: Clear-computed (= total_cents − Σ confirmed allocations).
        currency:
          type: string
          enum: [JPY]
        issued_at:
          type: string
          format: date
          nullable: true
        due_at:
          type: string
          format: date
          nullable: true
          description: Required before the receivable can be dunned or aged.
        status:
          $ref: '#/components/schemas/ManualReceivableStatus'
        created_at:
          type: string
        updated_at:
          type: string
          nullable: true
    ManualReceivableListResponse:
      type: object
      required: [items, limit, offset, total]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/ManualReceivable'
        limit:
          type: integer
        offset:
          type: integer
        total:
          type: integer
    ManualReceivableImportResult:
      type: object
      required: [created, skipped, errors]
      properties:
        created:
          type: integer
          description: Number of receivables created.
        skipped:
          type: integer
          description: Rows skipped as duplicates (existing reference_number).
        errors:
          type: array
          items:
            type: object
            required: [row, errors]
            properties:
              row:
                type: integer
                description: 1-based CSV line number of the invalid row.
              errors:
                type: array
                items:
                  type: object
                  required: [field, message]
                  properties:
                    field: { type: string }
                    message: { type: string }
    CreateManualReceivableRequest:
      type: object
      required: [reference_number, client_name, total_cents]
      properties:
        reference_number:
          type: string
          minLength: 1
          maxLength: 64
        client_name:
          type: string
          minLength: 1
          maxLength: 255
        recipient_email:
          type: string
          format: email
        total_cents:
          type: integer
          format: int64
          minimum: 1
        currency:
          type: string
          enum: [JPY]
          default: JPY
        issued_at:
          type: string
          format: date
        due_at:
          type: string
          format: date
      additionalProperties: false
    UpdateManualReceivableRequest:
      allOf:
        - $ref: '#/components/schemas/CreateManualReceivableRequest'
      description: Full replace of the editable fields (omitting an optional field clears it).
    ApplyClientCreditRequest:
      type: object
      required: [invoice_id, amount_cents]
      properties:
        invoice_id:
          type: integer
          format: int64
        amount_cents:
          type: integer
          format: int64
      additionalProperties: false

    ReverseRequest:
      type: object
      required: [reversal_reason]
      properties:
        reversal_reason:
          type: string
          minLength: 1
      additionalProperties: false

    DunningNotice:
      type: object
      required: [dunning_notice_id, organization_id, invoice_id, invoice_number, client_id,
                 recipient_email, outstanding_at_send_cents, due_at, channel, template_version, sent_by, sent_at]
      properties:
        dunning_notice_id:
          type: integer
          format: int64
        organization_id:
          type: integer
          format: int64
        invoice_id:
          type: integer
          format: int64
        invoice_number:
          type: string
        client_id:
          type: integer
          format: int64
        recipient_email:
          type: string
          format: email
        outstanding_at_send_cents:
          type: integer
          format: int64
        due_at:
          type: string
          format: date
          nullable: true
          description: Null when the invoice had no due date.
        channel:
          type: string
          example: email
        template_version:
          type: string
          example: '1.0'
        sent_by:
          type: integer
          format: int64
        sent_at:
          type: string
          format: date-time

    DunningNoticeListResponse:
      type: object
      required: [items, limit, offset, total]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/DunningNotice'
        limit:
          type: integer
        offset:
          type: integer
        total:
          type: integer

    AuditEvent:
      type: object
      required: [audit_event_id, organization_id, action, entity_type, entity_id, actor_id, occurred_at, before, after, metadata]
      properties:
        audit_event_id:
          type: integer
          format: int64
        organization_id:
          type: integer
          format: int64
        action:
          type: string
          description: Exact action string (see terminology registry §audit actions).
        entity_type:
          type: string
          description: Subject record type (see terminology registry §audit entity types).
        entity_id:
          type: integer
          format: int64
          nullable: true
          description: Subject record id; null when there is no single subject (e.g. failed login).
        actor_id:
          type: integer
          format: int64
          description: >
            Actor user id. The implementation always writes an integer; an
            unauthenticated event (e.g. failed login) records 0, not null.
        occurred_at:
          type: string
          format: date-time
        before:
          type: object
          nullable: true
          description: Sanitized snapshot before the change; null for creates.
          additionalProperties: true
        after:
          type: object
          nullable: true
          description: Sanitized snapshot after the change; null for deletes.
          additionalProperties: true
        metadata:
          type: object
          nullable: true
          description: Extra event context (e.g. invoice_id on dunning pause/resume); null when the event recorded none.
          additionalProperties: true

    AuditEventListResponse:
      type: object
      required: [items, limit, offset, total]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/AuditEvent'
        limit:
          type: integer
        offset:
          type: integer
        total:
          type: integer

    DunningPause:
      type: object
      required: [dunning_pause_id, invoice_id, paused_by, paused_at, paused_reason, unpaused_by, unpaused_at, is_active]
      properties:
        dunning_pause_id:
          type: integer
          format: int64
        invoice_id:
          type: integer
          format: int64
        paused_by:
          type: integer
          format: int64
        paused_at:
          type: string
          format: date-time
        paused_reason:
          type: string
        unpaused_by:
          type: integer
          format: int64
          nullable: true
        unpaused_at:
          type: string
          format: date-time
          nullable: true
        is_active:
          type: boolean

    DunningPauseListResponse:
      type: object
      required: [items, limit, offset, total]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/DunningPause'
        limit:
          type: integer
        offset:
          type: integer
        total:
          type: integer

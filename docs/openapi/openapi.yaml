      operationId: listDunningNotices
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
        - { name: invoice_number, in: query, schema: { type: string } }
        - { name: recipient_email, in: query, schema: { type: string } }
        - { name: outstanding_min_cents, in: query, schema: { type: integer, format: int64 } }
        - { name: outstanding_max_cents, in: query, schema: { type: integer, format: int64 } }
        - { name: sent_from, in: query, schema: { type: string, format: date } }
        - { name: sent_to, in: query, schema: { type: string, format: date } }
        - { name: sent_by, in: query, schema: { type: integer, format: int64 } }
        - { name: sort_by, in: query, description: "invoice_number | recipient_email | outstanding_cents | sent_at | sent_by", schema: { type: string } }
        - { name: sort_dir, in: query, schema: { type: string, enum: [asc, desc] } }
      responses:
        '200':
          description: Paginated dunning notice list.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DunningNoticeListResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      tags: [Dunning]
      summary: Send a dunning notice
      description: >
        Sends a professional overdue reminder to the client of the specified
        invoice. Checks eligibility (status in issued/partially_paid/overdue,
        outstanding > 0, pause status, minimum interval). Requires `send_dunning`.
      operationId: sendDunningNotice
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [invoice_id]
              properties:
                invoice_id:
                  type: integer
                  format: int64
                stage:
                  type: string
                  enum: [initial, reminder, final]
                  description: >
                    Dunning escalation stage (terminology registry §stage).
                    Optional; defaults to `initial` when omitted.
      responses:
        '201':
          description: Notice sent; record created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DunningNotice'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '503':
          $ref: '#/components/responses/UpstreamUnavailable'

  /admin/dunning-notices/{id}:
    parameters:
      - $ref: '#/components/parameters/IdPath'
    get:
      tags: [Dunning]
      summary: Get a dunning notice by ID
      operationId: getDunningNoticeById
      responses:
        '200':
          description: The dunning notice.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DunningNotice'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'


openapi: 3.1.0
info:
  title: NeNe Clear API
  version: 0.1.0
  description: >
    NeNe Clear — payment reconciliation and dunning (入金消込・督促管理).
    This file is the source of truth for Clear's public JSON API contract.
    Covered: multi-tenant auth/RBAC, clear settings, bank CSV import,
    read-only Invoice upstream proxy, reconciliation (propose/confirm/reverse),
    client credit, dunning (notices + per-invoice pause/resume), and CSV export.
    NeNe Clear does NOT issue invoices or compute tax — invoice figures are read
    from the NeNe Invoice upstream (see docs/integrations/invoice-upstream-contract.md).
    Conventions follow NENE2 (docs/development/nene2-compliance.md): RFC 9457
    Problem Details (application/problem+json), snake_case JSON, integer cents,
    items/limit/offset list envelope. Identifiers are governed by
    docs/explanation/terminology.md.
servers:
  - url: http://localhost:8384
    description: Local development server (NENE_CLEAR_PORT=8384)
security:
  - bearerAuth: []
tags:
  - name: System
    description: Health and runtime endpoints.
  - name: Auth
    description: Login and current-user.
  - name: Organization
    description: Tenant management (superadmin).
  - name: User
    description: Operator accounts within an organization (admin).
  - name: Settings
    description: Clear settings — Invoice upstream config and registered bank accounts.
  - name: BankImport
    description: Bank CSV import batches and their imported deposit lines.
  - name: BankTransaction
    description: Imported bank deposit lines (immutable evidence).
  - name: UpstreamInvoice
    description: Read-only proxy of NeNe Invoice open/overdue invoices.
  - name: Reconciliation
    description: Match proposal, confirmation, reversal (human-confirmed).
  - name: ClientCredit
    description: Overpayment credit balances and their application.
  - name: ManualReceivable
    description: Receivables entered directly in Clear, with no Invoice upstream (ADR 0014). A reconciliation reference, not an issued invoice.
  - name: Dunning
    description: Overdue reminders — send, history, pause/resume per invoice.
  - name: Export
    description: CSV export for accounting software handoff (税理士 review gate applies).
  - name: Audit
    description: Immutable audit trail (admin, read-only).

paths:
  /health:
    get:
      tags: [System]
      summary: Health endpoint
      description: Operational health check. Unauthenticated.
      operationId: getHealth
      security: []
      responses:
        '200':
          description: Service healthy.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
              examples:
                ok:
                  value:
                    status: ok
                    service: NeNe Clear
        '503':
          description: One or more checks failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /admin/auth/login:
    post:
      tags: [Auth]
      summary: Log in
      description: Exchange email and password for a JWT bearer token.
      operationId: login
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
            examples:
              ok:
                value:
                  email: operator@example.co.jp
                  password: "********"
      responses:
        '200':
          description: Authentication succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '401':
          description: Wrong email or password.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
              examples:
                invalidCredentials:
                  value:
                    type: https://nene-clear.dev/problems/invalid-credentials
                    title: Invalid Credentials
                    status: 401
                    detail: Email or password is incorrect.
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /admin/auth/me:
    get:
      tags: [Auth]
      summary: Current user
      operationId: getCurrentUser
      responses:
        '200':
          description: >
            The authenticated user, plus the org's fiscal year-end month
            (surfaced here so non-admins can default date-range filters).
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/User'
                  - type: object
                    properties:
                      fiscal_year_end_month:
                        type: integer
                        nullable: true
                        minimum: 1
                        maximum: 12
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /admin/auth/invitation:
    get:
      tags: [Auth]
      summary: Validate an invitation token
      description: >
        Public (no session). Validates the raw token from the invitation e-mail
        link and returns the invitee's e-mail so the accept-invite page can show
        who is being onboarded.
      operationId: getInvitation
      parameters:
        - name: token
          in: query
          required: true
          schema: { type: string }
      responses:
        '200':
          description: The invitation is valid.
          content:
            application/json:
              schema:
                type: object
                properties:
                  email: { type: string, format: email }
                required: [email]
        '404':
          $ref: '#/components/responses/NotFound'
        '410':
          description: Invitation token expired (`invitation-expired`).

  /admin/auth/invitation/accept:
    post:
      tags: [Auth]
      summary: Accept an invitation and set a password
      description: >
        Public (no session). Consumes the invitation token, sets the invitee's
        password and activates the account. The caller then logs in normally.
      operationId: acceptInvitation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                token: { type: string }
                password: { type: string, minLength: 8 }
              required: [token, password]
      responses:
        '200':
          description: The account is now active.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '404':
          $ref: '#/components/responses/NotFound'
        '410':
          description: Invitation token expired (`invitation-expired`).
        '422':
          $ref: '#/components/responses/ValidationFailed'

  /admin/organizations:
    get:
      tags: [Organization]
      summary: List organizations
      description: Cross-tenant. Requires capability `manage_organizations`.
      operationId: listOrganizations
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
      responses:
        '200':
          description: A page of organizations.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrganizationListResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalServerError'
    post:
      tags: [Organization]
      summary: Create organization
      operationId: createOrganization
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateOrganizationRequest'
      responses:
        '201':
          description: Organization created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Organization'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /admin/organizations/{id}:
    parameters:
      - $ref: '#/components/parameters/IdPath'
    get:
      tags: [Organization]
      summary: Get organization by id
      operationId: getOrganizationById
      responses:
        '200':
          description: The organization.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Organization'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
    delete:
      tags: [Organization]
      summary: Delete organization
      operationId: deleteOrganization
      responses:
        '204':
          description: Deleted.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /admin/users:
    get:
      tags: [User]
      summary: List users
      description: Requires capability `manage_users`.
      operationId: listUsers
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
      responses:
        '200':
          description: A page of users.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserListResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalServerError'
    post:
      tags: [User]
      summary: Create user
      operationId: createUser
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateUserRequest'
      responses:
        '201':
          description: User created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /admin/users/{id}:
    parameters:
      - $ref: '#/components/parameters/IdPath'
    get:
      tags: [User]
      summary: Get user by id
      operationId: getUserById
      responses:
        '200':
          description: The user.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
    put:
      tags: [User]
      summary: Update user
      operationId: updateUser
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateUserRequest'
      responses:
        '200':
          description: User updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '500':
          $ref: '#/components/responses/InternalServerError'
    delete:
      tags: [User]
      summary: Delete user
      operationId: deleteUser
      responses:
        '204':
          description: Deleted.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /admin/clear-settings:
    get:
      tags: [Settings]
      summary: Get clear settings
      description: >
        Invoice upstream config and registered bank accounts for the
        organization. The upstream token itself is never returned — only the env
        var name (`upstream_token_ref`). Requires `manage_clear_settings`.
      operationId: getClearSettings
      responses:
        '200':
          description: The clear settings.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClearSettings'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalServerError'
    put:
      tags: [Settings]
      summary: Update clear settings
      description: Update upstream config and the registered bank accounts (with CSV profiles).
      operationId: updateClearSettings
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateClearSettingsRequest'
      responses:
        '200':
          description: Updated settings.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClearSettings'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /admin/clear-settings/test-upstream:
    post:
      tags: [Settings]
      summary: Test the Invoice upstream connection
      operationId: testUpstreamConnection
      responses:
        '200':
          description: Connection test result.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UpstreamConnectionTestResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '503':
          $ref: '#/components/responses/UpstreamUnavailable'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /admin/bank-import-batches:
    get:
      tags: [BankImport]
      summary: List bank import batches
      operationId: listBankImportBatches
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
        - { name: source_filename, in: query, schema: { type: string } }
        - { name: status, in: query, schema: { $ref: '#/components/schemas/BankImportBatchStatus' } }
        - { name: row_count_min, in: query, schema: { type: integer } }
        - { name: row_count_max, in: query, schema: { type: integer } }
        - { name: imported_from, in: query, schema: { type: string, format: date } }
        - { name: imported_to, in: query, schema: { type: string, format: date } }
        - { name: sort_by, in: query, description: "id | source_filename | row_count | status | imported_at", schema: { type: string } }
        - { name: sort_dir, in: query, schema: { type: string, enum: [asc, desc] } }
      responses:
        '200':
          description: A page of import batches.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BankImportBatchListResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalServerError'
    post:
      tags: [BankImport]
      summary: Import a bank CSV
      description: >
        Upload a bank CSV for a registered bank account. The file is parsed with
        that account's CSV profile, stored as immutable bank transactions, and a
        SHA-256 file hash is recorded for duplicate detection. Requires
        `manage_reconciliation`.
      operationId: importBankCsv
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [bank_account_id, file]
              properties:
                bank_account_id:
                  type: integer
                  format: int64
                file:
                  type: string
                  format: binary
      responses:
        '201':
          description: Import batch created with imported lines.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BankImportBatch'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          description: Duplicate import (same file hash already imported).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
              examples:
                duplicate:
                  value:
                    type: https://nene-clear.dev/problems/duplicate-bank-import
                    title: Duplicate Bank Import
                    status: 409
                    detail: A batch with this file hash was already imported.
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /admin/bank-import-batches/{id}/reverse:
    parameters:
      - $ref: '#/components/parameters/IdPath'
    post:
      tags: [BankImport]
      summary: Reverse an import batch
      description: >
        Void the batch and its imported lines via a reversal (never a hard
        delete). Lines that are already matched must be unmatched first.
      operationId: reverseBankImportBatch
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReverseRequest'
      responses:
        '200':
          description: Batch reversed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BankImportBatch'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/InvalidStateTransition'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /admin/bank-transactions:
    get:
      tags: [BankTransaction]
      summary: List bank transactions
      description: >
        Searchable by transaction date, amount, counterparty, and status
        (電子帳簿保存法 search requirement). Requires `view_reconciliation`.
      operationId: listBankTransactions
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
        - name: status
          in: query
          schema:
            $ref: '#/components/schemas/BankTransactionStatus'
        - name: value_date_from
          in: query
          schema:
            type: string
            format: date
        - name: value_date_to
          in: query
          schema:
            type: string
            format: date
        - name: amount_min_cents
          in: query
          schema:
            type: integer
            format: int64
        - name: amount_max_cents
          in: query
          schema:
            type: integer
            format: int64
        - name: counterparty
          in: query
          schema:
            type: string
        - name: sort_by
          in: query
          description: "Sort column: value_date | amount_cents | counterparty_text | status."
          schema: { type: string }
        - name: sort_dir
          in: query
          schema: { type: string, enum: [asc, desc] }
      responses:
        '200':
          description: A page of bank transactions.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BankTransactionListResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /admin/bank-transactions/unmatched:
    get:
      tags: [BankTransaction]
      summary: List unmatched bank transactions
      description: >
        Convenience filter for `status=unmatched` / `partially_matched`,
        searchable by transaction date, amount, and counterparty and sortable
        (same query contract as `listBankTransactions`, minus `status`). The
        export endpoint accepts the same filter params.
      operationId: listUnmatchedTransactions
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
        - name: value_date_from
          in: query
          schema:
            type: string
            format: date
        - name: value_date_to
          in: query
          schema:
            type: string
            format: date
        - name: amount_min_cents
          in: query
          schema:
            type: integer
            format: int64
        - name: amount_max_cents
          in: query
          schema:
            type: integer
            format: int64
        - name: counterparty
          in: query
          schema:
            type: string
        - name: sort_by
          in: query
          description: "Sort column: value_date | amount_cents | counterparty_text."
          schema: { type: string }
        - name: sort_dir
          in: query
          schema: { type: string, enum: [asc, desc] }
      responses:
        '200':
          description: A page of unmatched bank transactions.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BankTransactionListResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /admin/bank-transactions/{id}:
    parameters:
      - $ref: '#/components/parameters/IdPath'
    get:
      tags: [BankTransaction]
      summary: Get bank transaction by id
      operationId: getBankTransactionById
      responses:
        '200':
          description: The bank transaction.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BankTransaction'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /admin/upstream/invoices:
    get:
      tags: [UpstreamInvoice]
      summary: List upstream invoices (read proxy)
      description: >
        Read-only proxy to NeNe Invoice. Returns open/overdue invoices with
        outstanding balances for matching and dunning eligibility. Clear never
        recomputes these figures.
      operationId: listUpstreamInvoices
      parameters:
        - name: status
          in: query
          description: "Comma-separated statuses, e.g. `issued,partially_paid,overdue`. Omitted = all open statuses."
          schema:
            type: string
      responses:
        '200':
          description: List of upstream invoices (read proxy; not paginated).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UpstreamInvoiceListResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '503':
          $ref: '#/components/responses/UpstreamUnavailable'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /admin/reconciliations/propose:
    post:
      tags: [Reconciliation]
      summary: Propose matches for a bank transaction
      description: >
        Returns ranked match suggestions. Read-only — it writes nothing and
        finalizes nothing. A human must confirm via `confirmMatch`.
      operationId: proposeMatch
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProposeMatchRequest'
      responses:
        '200':
          description: Ranked suggestions.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProposeMatchResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          $ref: '#/components/responses/UpstreamUnavailable'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /admin/reconciliations:
    get:
      tags: [Reconciliation]
      summary: List reconciliations
      operationId: listReconciliations
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
        - name: status
          in: query
          schema:
            $ref: '#/components/schemas/ReconciliationStatus'
        - { name: bank_transaction_id, in: query, schema: { type: integer, format: int64 } }
        - { name: invoice_id, in: query, description: Match reconciliations allocated to this invoice., schema: { type: integer, format: int64 } }
        - { name: confirmed_from, in: query, schema: { type: string, format: date } }
        - { name: confirmed_to, in: query, schema: { type: string, format: date } }
        - { name: sort_by, in: query, description: "id | bank_transaction_id | status | confirmed_at", schema: { type: string } }
        - { name: sort_dir, in: query, schema: { type: string, enum: [asc, desc] } }
      responses:
        '200':
          description: A page of reconciliations.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReconciliationListResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalServerError'
    post:
      tags: [Reconciliation]
      summary: Confirm a match (human-confirmed)
      description: >
        Allocate a bank transaction across one or more upstream invoices and
        write the resulting payment(s) to NeNe Invoice. Over-allocation beyond an
        invoice's outstanding is rejected; the excess is recorded as client
        credit. Appropriation across invoices is operator-directed. Requires
        `manage_reconciliation`.
      operationId: confirmMatch
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConfirmMatchRequest'
            examples:
              partial:
                summary: Two-invoice allocation of one deposit
                value:
                  bank_transaction_id: 5001
                  allocations:
                    - invoice_id: 123
                      amount_cents: 50000
                    - invoice_id: 124
                      amount_cents: 60000
      responses:
        '201':
          description: Reconciliation confirmed.
          content:

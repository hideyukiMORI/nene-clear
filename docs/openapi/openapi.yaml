          in: query
          description: Filter by subject record type (see terminology registry §audit entity types).
          schema:
            type: string
        - name: entity_id
          in: query
          description: Filter by subject record id (use together with entity_type).
          schema:
            type: integer
            format: int64
        - name: actor_id
          in: query
          schema: { type: integer, format: int64 }
        - name: occurred_from
          in: query
          description: Inclusive lower bound on occurred_at (YYYY-MM-DD).
          schema: { type: string, format: date }
        - name: occurred_to

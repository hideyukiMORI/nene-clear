        - name: amount_min_cents
          in: query
          schema: { type: integer, format: int64 }
        - name: amount_max_cents
          in: query
          schema: { type: integer, format: int64 }
        - name: remaining_min_cents
          in: query
          schema: { type: integer, format: int64 }
        - name: remaining_max_cents
          in: query
          schema: { type: integer, format: int64 }
        - name: created_from
          in: query
          description: Inclusive lower bound on created_at (YYYY-MM-DD).
          schema: { type: string, format: date }
        - name: created_to
          in: query
          description: Inclusive upper bound on created_at (YYYY-MM-DD).
          schema: { type: string, format: date }
        - name: sort_by

name: Backend CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  backend-check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo, pdo_sqlite, mbstring
          coverage: none

      - name: Get Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-${{ hashFiles('composer.lock') }}
          restore-keys: ${{ runner.os }}-composer-

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      # Dependency-vulnerability gate. Kept as its own step rather than folded into
      # `composer check`, so the job log (and any cross-repo tooling that reads it)
      # can tell whether the audit ran at all. A check that leaves no trace cannot be
      # distinguished from a check that is missing.
      - name: composer audit
        run: composer audit --no-interaction

      - name: Prepare environment
        run: cp .env.example .env

      - name: Create var directory
        run: mkdir -p var

      # composer check = phpunit + phpstan (level 8) + php-cs-fixer.
      # Contract tests auto-skip without NENE_INVOICE_API_BASE_URL.
      - name: Run checks
        run: composer check

  # ---------------------------------------------------------------------------
  # What the migration jobs below verify — and what they do not
  #
  # Clear supports three Phinx adapters (phinx.php): sqlite, mysql, pgsql. DDL
  # behaviour differs between them (defaults on TEXT columns, change_column type
  # conversions, how booleans are stored, index-name length limits), so a
  # migration can be green on one adapter and fail on another.
  #
  # Verified here: every migration applies **forward**, in order, on an **empty**
  # database, for each adapter that a deployment can actually use.
  #   - backend-check  → sqlite (the unit suite builds its own schema)
  #   - mysql-migrate  → mysql 8.4  (the docker-compose default; Tier A default)
  #   - postgres-migrate → postgres 17 (the optional DB_ADAPTER=pgsql path)
  #
  # Also verified, after the migrations apply: a **representative sample** of the
  # SQL shapes that differ between adapters — boolean predicates and binds,
  # LIMIT/OFFSET, date comparison, COUNT, insert-id retrieval, and the scheduler's
  # atomic lock — run through the real repository classes
  # (`tools/check-adapter-queries.php`, #417). The unit suite runs on SQLite only,
  # so without this step an adapter-specific *query* error ships green: two such
  # bugs were found by hand on 2026-08-04 with a fully green SQLite suite.
  #
  # NOT verified here, and deliberately out of scope for these jobs: rollback
  # (`migrations:rollback`), migrating over a database that already holds
  # production data, any data-migration semantics beyond DDL applying, and every
  # query the smoke does not touch — it is a sample, not coverage. If you add a
  # migration that rewrites existing rows, or a query in a shape not listed above,
  # those still need a human check. A green pipeline here does not cover them.
  #
  # The MySQL image is pinned to the same version as docker-compose.yml
  # (mysql:8.4). If one moves, move the other, or the job stops standing in for
  # the environment it is meant to protect.
  # ---------------------------------------------------------------------------

  mysql-migrate:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: nene_clear
          MYSQL_USER: nene_clear
          MYSQL_PASSWORD: nene_clear
          MYSQL_ROOT_PASSWORD: root_secret
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -uroot -proot_secret"
          --health-interval 5s --health-timeout 5s --health-retries 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo, pdo_mysql, mbstring
          coverage: none

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Migrate on MySQL
        env:
          DB_ADAPTER: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_NAME: nene_clear
          DB_USER: nene_clear
          DB_PASSWORD: nene_clear
        run: composer migrations:migrate

      # #417: catch SQL that only works on one adapter. Runs against the schema the
      # step above just built, so it exercises the real DDL rather than a fixture.
      - name: Query smoke on MySQL
        env:
          DB_ADAPTER: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_NAME: nene_clear
          DB_USER: nene_clear
          DB_PASSWORD: nene_clear
        run: php tools/check-adapter-queries.php

  postgres-migrate:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: nene_clear
          POSTGRES_USER: nene_clear
          POSTGRES_PASSWORD: nene_clear
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U nene_clear -d nene_clear"
          --health-interval 5s --health-timeout 5s --health-retries 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo, pdo_pgsql, mbstring
          coverage: none

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Migrate on PostgreSQL
        env:
          DB_ADAPTER: pgsql
          DB_HOST: 127.0.0.1
          DB_PORT: 5432
          DB_NAME: nene_clear
          DB_USER: nene_clear
          DB_PASSWORD: nene_clear
        run: composer migrations:migrate

      # #417 — see the block above the mysql job for what this does and does not cover.
      - name: Query smoke on PostgreSQL
        env:
          DB_ADAPTER: pgsql
          DB_HOST: 127.0.0.1
          DB_PORT: 5432
          DB_NAME: nene_clear
          DB_USER: nene_clear
          DB_PASSWORD: nene_clear
        run: php tools/check-adapter-queries.php

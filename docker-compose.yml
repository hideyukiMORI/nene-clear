services:
  mysql:
    image: mysql:8.4
    container_name: nene-clear-db
    ports:
      - "3383:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root_secret}
      MYSQL_DATABASE: ${DB_NAME:-nene_clear}
      MYSQL_USER: ${DB_USER:-nene_clear}
      MYSQL_PASSWORD: ${DB_PASSWORD:-nene_clear}
      TZ: Asia/Tokyo
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_ROOT_PASSWORD:-root_secret}"]
      interval: 5s
      timeout: 5s
      retries: 20

  # Optional PostgreSQL adapter (DB_ADAPTER=pgsql). MySQL stays the default Tier
  # A target; start this only when running against PostgreSQL:
  #   docker compose up -d postgres
  # then set DB_ADAPTER=pgsql and DB_PORT=5483 in .env.
  postgres:
    image: postgres:17
    container_name: nene-clear-pg
    ports:
      - "5483:5432"
    environment:
      POSTGRES_DB: ${DB_NAME:-nene_clear}
      POSTGRES_USER: ${DB_USER:-nene_clear}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-nene_clear}
      TZ: Asia/Tokyo
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-nene_clear} -d ${DB_NAME:-nene_clear}"]
      interval: 5s
      timeout: 5s
      retries: 20

  mailpit:
    image: axllent/mailpit:latest
    container_name: nene-clear-mail
    ports:
      - "1383:1025"
      - "8383:8025"
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: 1
      MP_SMTP_AUTH_ALLOW_INSECURE: 1

volumes:
  mysql_data:
  postgres_data:
